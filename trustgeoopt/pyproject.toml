[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgeoopt"
version = "0.1.0"
description = "Evidence-first research infrastructure for adaptive optimizer reliability"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
vision = ["torchvision>=0.16"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

